# ClaraOS continuous integration: the same `make` and `make test` as on the
# Mac, on Ubuntu. Both kernels are built with -Werror; the Lisp files are
# loaded and tested under SBCL (lisp/host/tests.lisp); then each kernel boots
# headless under QEMU with EDK2 firmware, from a disk made for it
# (tools/mkdisk.py), is typed the session of tools/session.txt over its
# serial port and has to answer as written, and runs on until its last line
# arrives (tools/boottest.sh), AArch64 twice, once for each version of its
# interrupt controller. The session ends by saving the world to the disk,
# and each machine boots a second time, from that disk, into the world it
# saved (tools/resumed.txt); fsck.fat looks at every disk afterwards. The
# runners have no hardware acceleration for QEMU, so every machine is
# emulated. The website
# is built as well: it reads ROADMAP.md, and stops building when a
# milestone entry loses its form.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The list is the one at the top of the Makefile. netcat is how
      # tools/boottest.sh asks the QEMU monitor for a screenshot, SBCL runs
      # the tests of the Lisp files (lisp/host/tests.lisp), Python makes the
      # disks that the machines boot from (tools/mkdisk.py), and fsck.fat,
      # of the dosfstools, looks at what a kernel wrote to one.
      - name: Install the Toolchain, QEMU and the Firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld make \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 netcat-openbsd sbcl \
            python3 dosfstools
          clang --version
          qemu-system-x86_64 --version
          sbcl --version

      - name: Build
        run: make

      - name: Test the Lisp Files and Boot Both Architectures
        run: make test

      # What each kernel said on its serial port, without the escape
      # sequences the firmware clears its screen with.
      - name: Show the Boot Reports
        if: always()
        run: |
          for log in build/boot-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            sed 's/\x1b\[[0-9;=]*[A-Za-z]//g' "$log"
            echo "::endgroup::"
          done

      - name: Build the Website
        run: make site

      - name: Upload the Boot Logs and Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-reports
          path: |
            build/boot-*.log
            build/session-*.txt
            build/qemu-*.log
            build/fsck-*.log
            build/screen-*.png
          if-no-files-found: ignore
