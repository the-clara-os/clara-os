# ClaraOS continuous integration: the same `make` and `make test` as on the
# Mac, on Ubuntu. Both kernels are built with -Werror, then each one boots
# headless under QEMU with EDK2 firmware until its last line arrives on the
# serial port (tools/boottest.sh). The runners have no hardware acceleration
# for QEMU, so both machines are emulated. The website is built as well: it
# reads ROADMAP.md, and stops building when a milestone entry loses its form.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The list is the one at the top of the Makefile. netcat is how
      # tools/boottest.sh asks the QEMU monitor for a screenshot.
      - name: Install the Toolchain, QEMU and the Firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld make \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 netcat-openbsd
          clang --version
          qemu-system-x86_64 --version

      - name: Build
        run: make

      - name: Boot Both Architectures
        run: make test

      # What each kernel said on its serial port, without the escape
      # sequences the firmware clears its screen with.
      - name: Show the Boot Reports
        if: always()
        run: |
          for log in build/boot-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            sed 's/\x1b\[[0-9;=]*[A-Za-z]//g' "$log"
            echo "::endgroup::"
          done

      - name: Build the Website
        run: make site

      - name: Upload the Boot Logs and Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-reports
          path: |
            build/boot-*.log
            build/qemu-*.log
            build/screen-*.png
          if-no-files-found: ignore
