# ClaraOS continuous integration: the same `make` and `make test` as on the
# Mac, on Ubuntu. Both kernels are built with -Werror; the Lisp files are
# loaded and tested under SBCL (lisp/host/tests.lisp); then each kernel boots
# headless under QEMU with EDK2 firmware, from a disk made for it
# (tools/mkdisk.py), is typed the session of tools/session.txt over its
# serial port and has to answer as written, and runs on until its last line
# arrives (tools/boottest.sh), AArch64 twice, once for each version of its
# interrupt controller. The session ends by saving the world to the disk,
# and each machine boots a second time, from that disk, into the world it
# saved (tools/resumed.txt); fsck.fat looks at every disk afterwards. What
# the user manual shows of the prompt (site/manual.html) is typed at one
# more machine, before and after it is started again. Each kind of
# processor is shut down, started again and turned off by its power button
# (tools/power.txt), and takes another system from a second disk
# (tools/upgrade.txt, tools/at-once.txt, tools/trial.txt); one machine
# fetches a signed release by HTTPS from a web server that the test starts
# on the runner, over QEMU's own network, with certificates that are made
# for the run, and upgrades to it (tools/network.txt, tools/serve.py,
# tools/certs.py). The build itself is laid out as a release too, with a
# key that is made for the run, by the `make release` with which the
# website's workflow publishes it (.github/workflows/site.yml), since that
# workflow has its key from an environment that only main deploys to, and
# so cannot be tried here. Every machine has a sound card, whose sound QEMU
# writes into a file, and what the sessions play has to be in that file as
# they say it (tools/heard.py). The
# runners have no hardware acceleration for QEMU, so every machine is
# emulated. The website
# is built as well: it reads ROADMAP.md, and stops building when a
# milestone entry loses its form, or when the kernel defines a name that
# the user manual says nothing about.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The list is the one at the top of the Makefile. netcat is how
      # tools/boottest.sh asks the QEMU monitor for a screenshot, SBCL runs
      # the tests of the Lisp files (lisp/host/tests.lisp), Python makes the
      # disks that the machines boot from (tools/mkdisk.py), is the web
      # server that one of them fetches from (tools/serve.py), by HTTPS as
      # well, for which it needs no more than its own ssl, makes the
      # certificates for that (tools/certs.py) and signs what is fetched
      # (tools/release.py), and fsck.fat, of the dosfstools,
      # looks at what a kernel wrote to one.
      - name: Install the Toolchain, QEMU and the Firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld make \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64 netcat-openbsd sbcl \
            python3 dosfstools
          clang --version
          qemu-system-x86_64 --version
          sbcl --version

      - name: Build
        run: make

      - name: Test the Lisp Files and Boot Both Architectures
        run: make test

      # What each kernel said on its serial port, without the escape
      # sequences the firmware clears its screen with.
      - name: Show the Boot Reports
        if: always()
        run: |
          for log in build/boot-*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            sed 's/\x1b\[[0-9;=]*[A-Za-z]//g' "$log"
            echo "::endgroup::"
          done

      - name: Build the Website
        run: make site

      - name: Upload the Boot Logs and Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-reports
          path: |
            build/boot-*.log
            build/session-*.txt
            build/qemu-*.log
            build/fsck-*.log
            build/serve-*.log
            build/screen-*.png
            build/heard-*.txt
            build/sound-*.wav
          if-no-files-found: ignore
