# The website, https://claraos.org, and with it the newest ClaraOS as a
# release: https://claraos.org/releases/ is where a ClaraOS looks for a
# newer one when it is told to upgrade and no other disk of its machine
# holds a system (lisp/system.lisp). Every deployment puts the whole site
# in the place of the one before, so every one of them builds the system
# of its commit, signs it and lays it out beside the pages, and what is
# published there is always the system of the newest commit on main that
# changed any of it. The paths are what goes into the site and into a
# system.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'ROADMAP.md'
      - 'kernel/**'
      - 'lisp/**'
      - 'tools/**'
      - 'Makefile'
      - 'fonts/**'
      - 'packages/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The page takes its version from kernel/kernel.h and its roadmap from
      # ROADMAP.md, and draws its headings with the console font, so it is
      # built, not copied.
      - name: Build the Site
        run: python3 -I site/build.py _site

      # The system of this commit, built the way CI builds it: the list is
      # the part of the Makefile's that a build needs.
      - name: Install the Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld make python3
          clang --version

      - name: Build the System
        run: make

      # The system becomes the release of this site (`make release`,
      # tools/release.py): its files, the list of them, and the signature
      # of that list, made with the key that only this environment has,
      # the secret RELEASE_KEY of github-pages, which takes deployments
      # from main and from nowhere else. The key is in a file that nobody
      # else on the runner can read for as long as the signing takes, and
      # no other step sees it. `make release` lays nothing out unless the
      # key is the one whose public half the system has in it
      # (lisp/system.lisp), and holds what it laid out against that half,
      # as a machine will: with another key in the secret, or with none,
      # this step fails, nothing is published, and the site stays as it
      # was, with the release that it had.
      - name: Sign the System and Lay It Out as a Release
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::The environment github-pages has no secret RELEASE_KEY, so there is nothing to sign the release with. Nothing is published, and the site stays as it was."
            exit 1
          fi
          key="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_KEY" > "$key")
          make release KEY="$key" RELEASES=_site/releases PACKAGES=_site/packages

      # The site goes to GitHub as an artifact of this run, and the
      # deployment finds it by its name in the list of the run's artifacts.
      # A run that is started again keeps the artifacts of its earlier
      # attempts, so the name has the attempt's number in it: with one name
      # for all of them, a second attempt finds two and stops, or finds the
      # first attempt's alone and publishes that one.
      - name: Upload the Site
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      # GitHub lists a new artifact some time after it has taken it, and
      # the deployment gives up at once when the list has none of that
      # name: "No artifacts named ..." (issue #102; actions/deploy-pages#451
      # is the same for everybody else). So the deployment waits ten
      # seconds, is tried again thirty seconds later when it fails, and a
      # last time a minute after that, which only then fails the job. A
      # green run with an error in it is one whose first try came too early.
      - name: Give GitHub Time to List the Site
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait Before the Second Try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages, Second Try
        id: second
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait Before the Third Try
        if: steps.second.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages, Third Try
        id: third
        if: steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
