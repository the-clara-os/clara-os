name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'ROADMAP.md'
      - 'fonts/spleen-8x16.bdf'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The page takes its version and its roadmap from ROADMAP.md and draws
      # its headings with the console font, so it is built, not copied.
      - name: Build the Site
        run: python3 -I site/build.py _site

      - name: Upload the Site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
